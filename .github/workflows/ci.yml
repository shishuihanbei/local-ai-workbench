name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          WORKBENCH_DATA: ${{ runner.temp }}/workbench-data
        run: pytest -q

  frontend:
    # 前端脚本没有构建步骤，靠浏览器现解析；这里只做语法与引用检查，
    # 挡的是「改了一行、少个括号，整块控制台白屏」这类在 pytest 里看不出来的问题。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check scripts
        run: |
          set -e
          for f in backend/console/*.js frontend/*.js; do
            echo "checking $f"
            node --check "$f"
          done
      - name: Every script is reachable from a page
        run: |
          set -e
          for f in backend/console/*.js frontend/*.js; do
            base=$(basename "$f")
            if ! grep -rq "$base" --include=*.html backend frontend; then
              echo "::error file=$f::没有被任何页面引用，改名或删除后忘了更新 HTML"
              exit 1
            fi
          done

  e2e:
    # 真浏览器点一遍：登录、发消息、开设置、控制台改品牌、看分享页。
    # 单测全绿不等于页面能点 —— 前端拆成十几个脚本后，时序与跨文件引用只能靠这层兜住。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Browser smoke
        env:
          WORKBENCH_E2E: "1"
        run: pytest -q tests/test_e2e_smoke.py
