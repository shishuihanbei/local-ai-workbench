name: local-ai-workbench

services:
  workbench:
    # 两种用法二选一：
    # 1) 在仓库目录直接 docker compose up -d：用本地源码构建镜像（默认方式）
    # 2) 只用镜像：docker compose pull && docker compose up -d
    #    官方镜像在 ghcr.io，私有仓库需要先 docker login ghcr.io
    build: .
    image: ghcr.io/shishuihanbei/local-ai-workbench:latest
    container_name: local-ai-workbench
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - ./data:/data          # 数据库、配置、上传、日志；必须可写并纳入备份
      - ./models:/models      # GGUF 模型目录（可选，镜像不含模型）
      - ./platforms:/platforms  # 下载的部署平台（llama.cpp 在 llama.cpp/ 下，可选）
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WORKBENCH_DATA: /data
      WORKBENCH_MODELS: /models
      WORKBENCH_PLATFORMS: /platforms
      WORKBENCH_LLAMA: /platforms/llama.cpp
      WORKBENCH_SERVE_FRONTEND: "1"
      # 首次启动会自动生成 data/secret.key；多副本或多个容器共用一份 data 时再显式指定同一个值
      WORKBENCH_SECRET: ${WORKBENCH_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:9100/api/health',timeout=3); raise SystemExit(0 if json.load(r).get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
