name: local-ai-workbench

services:
  workbench:
    build: .
    image: local-ai-workbench:latest
    container_name: local-ai-workbench
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - ./data:/data
      - ./models:/models
      - ./llama:/llama
    environment:
      TZ: Asia/Shanghai
      WORKBENCH_DATA: /data
      WORKBENCH_MODELS: /models
      WORKBENCH_LLAMA: /llama
      WORKBENCH_SERVE_FRONTEND: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:9100/api/health',timeout=3); raise SystemExit(0 if json.load(r).get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
