<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台分享 · 本地 AI 工作台</title>
<style>
  :root { color-scheme: light; --bg:#f5f7fb; --panel:#fff; --text:#172033; --muted:#697386; --line:#dfe5ef; --brand:#2f6bff; --soft:#eef3ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0,#e5eeff 0,transparent 42%),var(--bg); color:var(--text); font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:34px 20px 64px; }
  .brand { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:12.5px; margin-bottom:20px; }
  .mark { width:28px; height:28px; border-radius:9px; display:grid; place-items:center; background:linear-gradient(145deg,#5b8cff,#2f6bff); color:#fff; font-weight:800; font-size:11px; }
  .hero { position:relative; overflow:hidden; padding:28px; border:1px solid #dbe5ff; border-radius:22px; background:linear-gradient(135deg,#edf4ff,#fff 56%,#f4f0ff); box-shadow:0 18px 50px rgba(40,80,170,.11); }
  .hero::after { content:""; position:absolute; right:-40px; top:-50px; width:180px; height:180px; border-radius:50%; background:rgba(96,140,255,.14); }
  .icon { position:relative; z-index:1; width:64px; height:64px; display:grid; place-items:center; border-radius:18px; background:#fff; box-shadow:0 10px 25px rgba(40,80,170,.14); font-size:34px; }
  h1 { position:relative; z-index:1; margin:15px 0 0; font-size:27px; line-height:1.3; letter-spacing:-.02em; }
  .desc { position:relative; z-index:1; margin:7px 0 0; color:var(--muted); font-size:13px; max-width:560px; }
  .owner { position:relative; z-index:1; margin-top:12px; color:#8a93a3; font-size:11.5px; }
  .caps { position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
  .caps span { padding:2px 7px; border:1px solid #d9e4ff; border-radius:999px; background:rgba(255,255,255,.65); color:#3159c9; font-size:9.5px; font-weight:600; }
  .section-title { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:24px 0 10px; }
  .section-title b { font-size:13.5px; }
  .section-title span { color:var(--muted); font-size:11px; }
  .quick-list { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .quick { min-width:0; padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
  .quick b { display:block; font-size:12.5px; }
  .quick small { display:block; margin-top:4px; color:var(--muted); font-size:10.5px; line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .quick em { display:inline-block; margin-top:7px; padding:1px 6px; border-radius:5px; background:var(--soft); color:var(--brand); font-size:9px; font-style:normal; }
  .actions { display:flex; align-items:center; flex-wrap:wrap; gap:9px; margin-top:22px; }
  .primary { height:40px; padding:0 18px; border:0; border-radius:11px; background:var(--brand); color:#fff; font-size:13px; font-weight:700; cursor:pointer; }
  .primary:hover { background:#255ee8; }
  .primary:disabled { opacity:.6; cursor:default; }
  .ghost { height:40px; padding:0 14px; border:1px solid var(--line); border-radius:11px; background:var(--panel); color:var(--text); font-size:12.5px; text-decoration:none; display:inline-flex; align-items:center; }
  .notice { margin-top:15px; color:var(--muted); font-size:11.5px; line-height:1.6; }
  .error { padding:54px 24px; border:1px solid var(--line); border-radius:18px; background:var(--panel); text-align:center; }
  .error b { display:block; margin-bottom:7px; font-size:20px; }
  .error span { color:var(--muted); }
  .loading { padding:70px 0; text-align:center; color:var(--muted); }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); padding:9px 14px; border-radius:10px; background:#172033; color:#fff; font-size:12px; opacity:0; pointer-events:none; transition:opacity .18s; }
  .toast.show { opacity:1; }
  @media (max-width: 620px) { .quick-list { grid-template-columns:1fr; } .hero { padding:22px; } h1 { font-size:23px; } .icon { width:54px; height:54px; font-size:28px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark">AI</span><span>本地 AI 工作台 · 工作台分享</span></div>
  <div id="view"><div class="loading">正在读取工作台…</div></div>
</div>
<div class="toast" id="toast"></div>
<script src="/workbench-share.js?v=0.7.87.2"></script>
</body>
</html>
