<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话分享 · 本地 AI 工作台</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f4; --panel:#fff; --text:#1d2521; --muted:#6b756f; --line:#dfe5df; --accent:#2f7d5c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151917; --panel:#1c221f; --text:#e8eee9; --muted:#98a49c; --line:#2c3530; --accent:#79c79d; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:38px 20px 70px; }
  .brand { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; margin-bottom:22px; }
  .mark { width:26px; height:26px; border-radius:8px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; }
  h1 { font-size:26px; line-height:1.35; margin:0 0 8px; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:8px 22px; box-shadow:0 12px 40px rgba(0,0,0,.05); }
  .msg { padding:16px 0; border-bottom:1px solid var(--line); white-space:pre-wrap; word-break:break-word; }
  .msg:last-child { border-bottom:0; }
  .msg b { display:block; margin-bottom:6px; font-size:12px; color:var(--muted); letter-spacing:.04em; }
  .empty, .error { padding:40px 0; text-align:center; color:var(--muted); }
  .error b { display:block; color:var(--text); font-size:18px; margin-bottom:8px; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; }
  .notice { margin-top:16px; padding:10px 12px; border:1px dashed var(--line); border-radius:10px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark">AI</span><span>本地 AI 工作台 · 只读分享</span></div>
  <h1 id="title">对话分享</h1>
  <div class="meta" id="meta">正在读取分享内容…</div>
  <div class="panel" id="messages"><div class="empty">加载中…</div></div>
  <div class="notice">这是分享时保存的消息快照，不会随后续对话变化。公开链接请勿转发给不相关的人。</div>
  <div class="foot">内容由本地模型生成，可能存在偏差。</div>
</div>
<script src="/share.js?v=__ASSET_VERSION__"></script>
</body>
</html>
